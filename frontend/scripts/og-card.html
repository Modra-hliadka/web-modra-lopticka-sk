<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }

    font-family: 'DM Sans', system-ui, sans-serif;
    background: linear-gradient(135deg, #f3faff 0%, #ffffff 60%);

    align-items: center;
    position: relative;

  .logo { position: absolute; top: 48px; left: 64px; height: 34px; }

    font-size: 72px;
    line-height: 1.05;
    color: #1b2b52;

    margin-top: 20px;
    font-size: 24px;
    line-height: 1.4;
    color: rgba(27, 43, 82, 0.75);
    max-width: 560px;
  }
  .url {
    margin-top: 28px;
    font-size: 22px;
    font-weight: 700;
    color: #334d88;
  }
  .visual { flex: 0.95; display: flex; justify-content: center; align-items: center; }
  .ball-wrap {
    position: relative;
    width: 420px;
    height: 420px;
    border-radius: 48px;
    background: #e1f3fd;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg.ball { width: 340px; height: 340px; filter: drop-shadow(0 20px 30px rgba(20, 31, 58, 0.25)); }
</style>
